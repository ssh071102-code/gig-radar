[project]
name = "gig-radar"
version = "0.1.0"
description = "Freelance lead-gen pipeline: multi-source ingestion, LLM triage and scoring, tailored proposal drafts, Telegram delivery."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Laurin Lin" }]
keywords = ["llm", "automation", "lead-generation", "freelance", "telegram", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
reddit = ["praw>=7.7"]
dev = ["pytest>=8.0", "pytest-mock>=3.12", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
gig-radar = "gig_radar.cli:app"

[project.urls]
Repository = "https://github.com/ssh071102-code/gig-radar"
Issues = "https://github.com/ssh071102-code/gig-radar/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
